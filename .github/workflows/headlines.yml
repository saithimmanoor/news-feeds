name: Collect headlines
on:
  schedule:
    - cron: "30 3 * * *"   # 03:30 UTC = 04:30/05:30 Amsterdam, well before the 06:24 refresh
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python fetch_headlines.py feeds.json headlines.json
      - name: Commit result
        run: |
          git config user.name "headlines-bot"
          git config user.email "headlines-bot@users.noreply.github.com"
          git add headlines.json
          git diff --staged --quiet || git commit -m "Update headlines"
          git push
